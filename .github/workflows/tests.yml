name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -k "not optional_xgboost_and_torch"

  optional-models:
    name: Optional XGBoost smoke (Python 3.15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # PyTorch does not yet publish Python 3.15 wheels. Keep the Python 3.15
      # CI lane useful by smoke-testing XGBoost independently of the LSTM extra.
      - run: python -m pip install -e ".[test]" xgboost
      - run: python -m pytest tests/test_research.py -q -k optional_xgboost_smoke
